<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Roger · iMessage demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230B84FE'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-weight='700' font-size='32' fill='%23fff'%3ER%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/imessage/imessage.css">
</head>
<body>
<main class="stage">
  <div class="phone" aria-label="iPhone running Messages">
    <div class="island" aria-hidden="true"></div>
    <div class="screen">
      <div class="status" aria-hidden="true">
        <span class="clock" id="clock">9:41</span>
        <span class="status-icons">
          <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.2A10.3 10.3 0 0 0 8 .5 10.3 10.3 0 0 0 .9 3.4L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.7.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.8 1.9L4.4 7A5.1 5.1 0 0 1 8 5.6Zm0 3.4c-.6 0-1.2.2-1.6.6L8 11.5l1.6-1.9c-.4-.4-1-.6-1.6-.6Z"/></svg>
          <svg viewBox="0 0 27 12" width="27" height="12"><rect x=".5" y=".5" width="23" height="11" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="8" rx="2"/><path d="M25 4v4c.8-.3 1.5-1.1 1.5-2S25.8 4.3 25 4Z" opacity=".4"/></svg>
        </span>
      </div>

      <header class="nav">
        <span class="back" aria-hidden="true"><svg viewBox="0 0 12 20" width="12" height="20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="contact">
          <span class="avatar" aria-hidden="true">R</span>
          <span class="name">Roger <svg viewBox="0 0 8 12" width="6" height="9" aria-hidden="true"><path d="m1.5 1.5 4.5 4.5-4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </div>
        <button class="nav-btn" id="restartTop" type="button" aria-label="Restart conversation" title="Restart conversation">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 12a9 9 0 1 0 3-6.7M3 3v6h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </header>

      <div class="log" id="log" role="log" aria-live="polite" aria-label="Conversation with Roger">
        <p class="stamp"><b>iMessage</b><br><span id="today">Today</span></p>
      </div>

      <div class="suggest" id="suggest" aria-label="Suggested replies"></div>

      <form class="compose" id="compose" autocomplete="off">
        <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
        <div class="field">
          <input id="text" type="text" placeholder="iMessage" aria-label="Message">
          <button class="send" id="send" type="submit" aria-label="Send" disabled>
            <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </form>
      <div class="home" aria-hidden="true"></div>
    </div>
  </div>

  <aside class="side">
    <h1>Roger in iMessage</h1>
    <p class="lead">Local stand-in for the iMessage gateway. Every message goes to <code>POST /api/imessage/inbound</code>, the same endpoint a real gateway would call, and the replies render the way iPhone shows them.</p>
    <dl class="status-list" id="status">
      <div><dt>Google data</dt><dd>checking…</dd></div>
      <div><dt>Claude</dt><dd>checking…</dd></div>
    </dl>
    <h2>Try</h2>
    <div class="tries" id="tries"></div>
    <div class="actions">
      <button class="btn" id="restart" type="button">Restart conversation</button>
      <a class="btn ghost" href="/">Open Studio</a>
    </div>
  </aside>
</main>
<script src="/imessage/imessage.js"></script>
</body>
</html>
