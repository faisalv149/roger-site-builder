<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Roger · Leads</title><link rel="stylesheet" href="/app/frontend.css">
<style>
.leads{display:grid;gap:12px}
.lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.lead h3{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.lead .when{color:var(--muted);font-weight:500;font-size:12px}
.lead dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:10px 0 0}
.lead dt{color:var(--muted)}.lead dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.lead .photo img{width:140px;height:105px;object-fit:cover;border-radius:10px;border:1px solid var(--line);display:block}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2)}
.pill.ok{color:var(--ok);border-color:var(--ok-200);background:var(--ok-50)}.pill.warn{color:var(--warn);background:var(--warn-50);border-color:#FDE68A}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
@media (max-width:640px){.lead{grid-template-columns:1fr}.lead .photo img{width:100%;height:auto;aspect-ratio:4/3}}
</style></head>
<body>
<header class="top">
  <a class="brand" href="/app/"><span class="logo" aria-hidden="true">R</span><span><b>Roger Studio</b><span class="sub">Quote and appointment requests from splash pages</span></span></a>
  <nav aria-label="Staff"><a href="/app/frontend.html">New site</a><a href="/app/imessage-reviews.html">Reviews</a><a href="/app/leads.html" aria-current="page">Leads</a><a href="/app/imessage-reviews.html#invites">Invites</a></nav>
</header>
<main class="work">
  <section class="card">
    <div class="bar"><div><h2>Leads</h2><p class="hint" id="summary">Loading…</p></div><button class="btn ghost" id="refresh" type="button">Refresh</button></div>
  </section>
  <div class="leads" id="leads" aria-live="polite"></div>
</main>
<script src="/app/leads.js"></script>
<script src="/app/version.js" defer></script></body></html>
